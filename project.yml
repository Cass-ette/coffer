name: Coffer
options:
  bundleIdPrefix: cc.cassette
  deploymentTarget:
    macOS: "26.0"
packages:
  CofferCore:
    path: CofferCore
targets:
  Coffer:
    type: application
    platform: macOS
    sources:
      - path: app
    dependencies:
      - package: CofferCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.cassette.coffer
        PRODUCT_NAME: Coffer
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: app/Info.plist
      properties:
        CFBundleDisplayName: Coffer
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.utilities
